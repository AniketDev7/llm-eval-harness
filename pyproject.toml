[project]
name = "llm-eval-harness"
version = "1.0.0"
description = "A framework for testing LLM outputs - prompt regression, response validation, drift detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aniket Shikhare" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "sentence-transformers>=3.0.0",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
llm-eval = "llm_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_eval"]
